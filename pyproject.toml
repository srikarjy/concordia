[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "concordia-xai"
version = "0.1.0"
description = "Provenance-first auditing of genomic foundation-model explanations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "srikar jy" }]
dependencies = [
  "fastapi>=0.116,<1",
  "gradio_client>=1.8,<2",
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rdkit>=2025.3,<2027",
  "scikit-learn>=1.7,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
xai = ["shap>=0.48,<1"]
scientist = ["ollama>=0.4,<1"]
llama = ["llama-cpp-python>=0.3,<1"]
virtual-cell = ["anndata>=0.12,<0.14"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "biopython>=1.85,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "matplotlib>=3.10,<4",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
concordia = "concordia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/concordia"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy/score_complex_against_crystal.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["(^|/)legacy/"]

[[tool.mypy.overrides]]
module = ["concordia.stability.*", "scripts.*", "select_tsuboyama_domain", "build_tsuboyama_summary"]
disallow_untyped_defs = true
