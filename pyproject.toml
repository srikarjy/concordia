[project]
name = "concordia"
version = "0.1.0"
description = "Diagnostic image classification with cross-validated, measured explanations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "pillow>=10.0",
    "numpy>=1.26",
    "click>=8.1",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
concordia = "concordia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
