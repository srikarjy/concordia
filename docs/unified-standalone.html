<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:var(--blue)}a:hover{color:#163C82}
.mono{font-family:ui-monospace,"IBM Plex Mono",SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
header.topbar{background:#0F1720;color:#E8EDF2;padding:0 20px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:10px 0}
.brand .name{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}

nav.toptabs a.active{color:#fff;background:#1F2A36}
.scope{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#A9B6C3;padding:10px 0}

main{width:100%;max-width:1200px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{display:flex;align-items:baseline;gap:8px}
.kpi .val .n{font-size:26px;font-weight:600}
.kpi .val .u{font-size:12.5px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.panel{flex:1 1 380px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.panel.grow{flex:999 1 560px}
.panel .ph{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel .ph h2{margin:0;font-size:15px;font-weight:600}
.panel .ph .sub{font-size:12px;color:var(--muted)}
.badge{font-size:11.5px;font-weight:600;border-radius:5px;padding:3px 8px;white-space:nowrap}
.badge.ok{color:var(--green);background:var(--green-bg)}
.badge.blocked{color:var(--red);background:var(--red-bg)}
table.ranker{width:100%;border-collapse:collapse}
table.ranker td,table.ranker th{padding:12px 0;vertical-align:middle}
table.ranker thead th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line-soft);text-align:left}
table.ranker tbody tr{border-bottom:1px solid var(--line-soft)}
table.ranker tbody tr:last-child{border-bottom:none}
.barwrap{position:relative;height:22px;min-width:160px}
.barwrap .track{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line-soft)}
.barwrap .zero{position:absolute;top:0;bottom:0;width:1px;background:#9AA5B1}
.barwrap .range{position:absolute;top:7px;height:8px;border-radius:4px;background:#C9DAF8}
.barwrap .point{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:999px;background:var(--blue);border:2px solid #fff;box-sizing:border-box}
.guard-item{padding:14px 20px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.guard-item:last-child{border-bottom:none}
.guard-item .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.guard-item .ctx{font-size:12.5px;color:var(--muted)}
.ledger-body{padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.chain{display:flex;align-items:center}
.chain .node{width:14px;height:14px;border-radius:4px;background:var(--green);flex-shrink:0}
.chain .link{flex:1;height:2px;background:#9FD3BC}
.ledger-stats{display:flex;gap:28px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.ledger-stats b{font-size:15px;font-weight:600;color:var(--text)}
.data-body{padding:4px 20px 14px}
.data-row{padding:14px 0;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.data-row:last-child{border-bottom:none}
.data-row .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.splitbar{display:flex;height:8px;border-radius:4px;overflow:hidden}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.decisions{display:flex;gap:8px;flex-wrap:wrap}
.decision{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px}
.panel-footnote{padding:0 20px 16px;font-size:12px;color:var(--muted)}
footer.page{border-top:1px solid var(--line);margin-top:8px;padding:18px 2px 0;color:var(--muted);font-size:13px;max-width:1200px;margin-left:auto;margin-right:auto;padding-left:20px;padding-right:20px}
</style></head><body>

var app=document.getElementById("app");

/* ---- KPI row ---- */
var kpis=add(app,el("div","kpis"));
function kpi(label,n,unit,cls){var k=add(kpis,el("div","kpi"));add(k,el("div","label",label));var v=add(k,el("div","val"));add(v,el("span","n",n));var u=add(v,el("span","u",unit));if(cls)u.style.color=cls;}
kpi("Tests","603","passing","var(--green)");
kpi("Artifact hashes","100%","match disk","var(--green)");
kpi("Ledger","0","breaks","var(--green)");
kpi("Guard",String(stability.refusals.length),"blocked","var(--red)");

/* ---- Ranker + Guard ---- */
var row1=add(app,el("div","row"));
var ranker=panel(row1,"ranker","Stability ranker","ΔΔG kcal/mol · 90% CI");
ranker.classList.add("grow");
ranker.querySelector(".ph").appendChild(el("span","mono sub","1IGV · position held-out"));

var sorted=stability.ranked_candidates.slice().sort(function(a,b){return a.rank-b.rank});
var allLow=Math.min.apply(null,sorted.map(function(c){return c.interval_low})),
    allHigh=Math.max.apply(null,sorted.map(function(c){return c.interval_high}));
var pad=(allHigh-allLow)*0.15||1;
allLow-=pad;allHigh+=pad;
var span=allHigh-allLow;
function pct(v){return ((v-allLow)/span*100).toFixed(1)+"%";}

var tableWrap=add(ranker,el("div",""));tableWrap.style.cssText="overflow-x:auto";
var tinner=add(tableWrap,el("div",""));tinner.style.cssText="min-width:520px;padding:4px 20px 18px";
var table=add(tinner,el("table","ranker"));
var thead=add(table,el("thead"));var thr=add(thead,el("tr"));
["#","Mutation","ΔΔG",""].forEach(function(x){add(thr,el("th","",x));});
var tbody=add(table,el("tbody"));
sorted.forEach(function(c,i){
  var tr=add(tbody,el("tr"));
  add(tr,el("td","mono",String(i+1).padStart(2,"0")));
  add(tr,el("td","mono",c.variant_id.split("_").pop()));
  add(tr,el("td","mono",c.ddg.toFixed(3)));
  var td=add(tr,el("td",""));var bw=add(td,el("div","barwrap"));
  add(bw,el("div","track"));
  var zero=add(bw,el("div","zero"));zero.style.left=pct(0);

stability.refusals.forEach(function(r){
  var g=add(guard,el("div","guard-item"));
  var hd=add(g,el("div","hd"));
  add(hd,el("span","mono",r.variant_id.split("_").pop()));
  add(hd,el("span","badge blocked","blocked"));
  var parts=[];
  r.triggers.forEach(function(t){
    var d=[];
    if(t.feature_type)d.push(t.feature_type);
    if(t.accession)d.push(t.accession);
    if(t.uniprot_position!==undefined)d.push("position "+t.uniprot_position);
    if(t.mutation_count!==undefined)d.push(t.mutation_count+" mutations");
    parts.push((d.length?d.join(", "):t.code));

  add(g,el("div","ctx",parts.join(" · ")));
});

[[ledger.runs_checked,"runs"],[ledger.events_checked,"events"],[ledger.breaks.length,"breaks"]].forEach(function(x){

});

var pgaName=add(pgaHd,el("span",""));var pgaId=add(pgaName,el("span","mono","1PGA"));pgaId.style.fontWeight="600";pgaName.appendChild(document.createTextNode(" "));add(pgaName,el("span","","Protein G"));
add(pgaHd,el("span","mono","930 variants"));
var split=add(pgaRow,el("div","splitbar"));
var trainSpan=add(split,el("span",""));trainSpan.style.cssText="flex:745;background:var(--blue)";
var heldSpan=add(split,el("span",""));heldSpan.style.cssText="flex:185;background:var(--amber)";
var legend=add(pgaRow,el("div","legend"));
var l1=add(legend,el("span",""));var sw1=add(l1,el("span","sw"));sw1.style.background="var(--blue)";l1.appendChild(document.createTextNode("745 train"));
var l2=add(legend,el("span",""));var sw2=add(l2,el("span","sw"));sw2.style.background="var(--amber)";l2.appendChild(document.createTextNode("185 held out"));
var decisions=add(pgaRow,el("div","decisions"));
pga_decisions.forEach(function(x){add(decisions,el("span","decision",x[0]+" "+x[1]));});
var bundleLink=add(pgaRow,el("div",""));bundleLink.style.cssText="font-size:12.5px";
var a=add(bundleLink,el("a","","Download bundle"));a.href="../frontend/public/public-data-review/bundle.zip";a.download="";
bundleLink.appendChild(document.createTextNode(" · "));
add(bundleLink,el("code","mono",pga_bundle_hash.slice(0,8)+"…"));

var igvRow=add(db,el("div","data-row"));
var igvHd=add(igvRow,el("div","hd"));
var igvName=add(igvHd,el("span",""));var igvId=add(igvName,el("span","mono","1IGV"));igvId.style.fontWeight="600";igvName.appendChild(document.createTextNode(" "));add(igvName,el("span","","Mutant library"));
add(igvHd,el("span","mono","11 held-out positions"));

add(dataPanel,el("div","panel-footnote","Upload-and-inspect for your own protein runs live in the full workspace."));

})();
</script>
